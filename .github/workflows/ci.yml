name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Coverage gate (80% lines and functions)
        run: bun run test:coverage

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Regression gate (golden dataset, mock mode)
        run: bun src/cli.ts eval --threshold 0.85 --report eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  bench-mock:
    # Matriz OS × filtro de provider, só com mocks: bench real consome quota e
    # fica no workflow bench (manual/nightly). O filtro segue `astro bench --models`.
    name: bench-mock (${{ matrix.os }}, ${{ matrix.provider-filter }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        provider-filter: ["nvidia", "openrouter"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Bench mock (${{ matrix.provider-filter }})
        # `-t` roda só o caso do filtro desta perna; os demais testes do bench
        # já rodam no job `test` nos dois SOs.
        run: |
          bun test tests/bench.test.ts -t 'filtro do CI matrix restringe o bench com mocks: ${{ matrix.provider-filter }}'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
